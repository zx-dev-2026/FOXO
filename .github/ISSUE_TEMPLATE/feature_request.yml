name: 功能建议
 description: 提出改进 FOXO 的想法
 title: "[建议] "
 labels: ["enhancement"]
 body:
  - type: markdown
    attributes:
      value: |
        请描述你希望解决的实际需求。建议不代表该功能已存在或一定会实现。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题或需求
      description: 说明当前做法遇到的困难。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方式
      description: 可以提供一个或多个设想。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或补充信息
      description: 可选；请勿包含密钥或个人敏感数据。
    validations:
      required: false
